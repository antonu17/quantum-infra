services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - proxy

  mealie:
    image: ghcr.io/mealie-recipes/mealie:v3.22.0
    restart: unless-stopped

    volumes:
      - mealie_data:/app/data

    environment:
      ALLOW_SIGNUP: "false"
      PUID: 1000
      PGID: 1000
      TZ: Europe/Berlin
      BASE_URL: https://mealie.home.antonu.org

    networks:
      - proxy

  pihole:
    image: pihole/pihole:latest
    restart: unless-stopped

    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "67:67/udp"

    environment:
      TZ: Europe/Berlin
      WEBPASSWORD: ${PIHOLE_PASSWORD}
      ServerIP: 192.168.100.2

    dns:
      - 127.0.0.1
      - 8.8.8.8

    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./pihole/etc-pihole:/etc/pihole
      - ./pihole/etc-dnsmasq.d:/etc/dnsmasq.d

    cap_add:
      - NET_ADMIN

    networks:
      - proxy
      - pihole-internal

  pihole-exporter:
    image: ekofr/pihole-exporter:latest
    restart: unless-stopped

    environment:
      PIHOLE_HOSTNAME: pihole
      PIHOLE_PASSWORD: ${PIHOLE_PASSWORD}
      INTERVAL: 30s
      PORT: 9617

    networks:
      - pihole-internal
      - monitoring

networks:
  proxy:
  pihole-internal:
    internal: true
  monitoring:

volumes:
  caddy_data:
  caddy_config:
  mealie_data:
    external: true
    name: pi-mealie_mealie-data
