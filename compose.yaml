services:
  caddy:
    build:
      context: ./caddy
    restart: unless-stopped
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./caddy:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - proxy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  mealie:
    image: ghcr.io/mealie-recipes/mealie:v3.22.0
    restart: unless-stopped

    volumes:
      - mealie_data:/app/data

    environment:
      ALLOW_SIGNUP: "false"
      PUID: 1000
      PGID: 1000
      TZ: Europe/Berlin
      BASE_URL: https://mealie.home.antonu.org

    networks:
      - proxy

  pihole:
    image: pihole/pihole:latest
    restart: unless-stopped

    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "67:67/udp"

    environment:
      TZ: Europe/Berlin
      WEBPASSWORD: ${PIHOLE_PASSWORD}
      ServerIP: 192.168.100.2

    dns:
      - 127.0.0.1
      - 8.8.8.8

    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./pihole/etc-pihole:/etc/pihole
      - ./pihole/etc-dnsmasq.d:/etc/dnsmasq.d

    cap_add:
      - NET_ADMIN

    networks:
      - proxy
      - pihole-internal

  pihole-exporter:
    image: ekofr/pihole-exporter:latest
    restart: unless-stopped

    environment:
      PIHOLE_HOSTNAME: pihole
      PIHOLE_PASSWORD: ${PIHOLE_PASSWORD}
      INTERVAL: 30s
      PORT: 9617

    networks:
      - pihole-internal
      - monitoring

  deconz:
    image: deconzcommunity/deconz
    restart: unless-stopped

    ports:
      - "8080:8080"
      - "8443:8443"

    volumes:
      - ./deconz:/opt/deCONZ

    devices:
      - /dev/ttyAMA0:/dev/ttyAMA0

    environment:
      DECONZ_WEB_PORT: "8080"
      DECONZ_WS_PORT: "8443"
      DEBUG_INFO: "1"
      DEBUG_APS: "0"
      DEBUG_ZCL: "0"
      DEBUG_ZDP: "0"
      DEBUG_OTA: "0"

    networks:
      - proxy

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped

    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus

    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=90d
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles

    networks:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped

    volumes:
      - /etc/localtime:/etc/localtime:ro
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro

    env_file:
      - ./monitoring/grafana/config.monitoring

    networks:
      - monitoring
      - proxy

    depends_on:
      - prometheus

  ping:
    image: prom/blackbox-exporter:latest
    restart: unless-stopped

    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./monitoring/blackbox/config:/config:ro

    command:
      - --config.file=/config/blackbox.yml

    networks:
      - monitoring

  speedtest:
    image: miguelndecarvalho/speedtest-exporter:latest
    restart: unless-stopped

    healthcheck:
      test: "wget --no-verbose --tries=1 --spider http://0.0.0.0:9798/"
      timeout: 10s

    networks:
      - monitoring

  nodeexp:
    image: prom/node-exporter:latest
    restart: unless-stopped
    privileged: true

    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro

    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --collector.filesystem.ignored-mount-points
      - "^/(sys|proc|dev|host|etc|rootfs/var/lib/docker/containers|rootfs/var/lib/docker/overlay2|rootfs/run/docker/netns|rootfs/var/lib/docker/aufs)($$|/)"

    networks:
      - monitoring

networks:
  proxy:
  pihole-internal:
    internal: true
  monitoring:

volumes:
  caddy_data:
  caddy_config:
  mealie_data:
    external: true
    name: pi-mealie_mealie-data
  prometheus-data:
    external: true
    name: internet-monitoring_prometheus_data
  grafana-data:
    external: true
    name: internet-monitoring_grafana_data
